[package]
name = "snapmark"
version = "0.2.0"
edition = "2021"
description = "A local-first developer knowledge vault with a CLI and local web UI."
license = "MIT"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
