[package]
name = "snapmark"
version = "0.1.0"
edition = "2021"
description = "A fast local-first bookmark and snippet manager for the terminal."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
