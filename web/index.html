<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>snapmark</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#090909;color:#eee}
body{max-width:1000px;margin:0 auto;padding:48px 20px}h1{font-size:42px;margin:0 0 8px}p{color:#999}
input,button,textarea{font:inherit;background:#111;color:#eee;border:1px solid #2b2b2b;border-radius:10px;padding:12px}
input{width:100%;box-sizing:border-box;margin:20px 0}.grid{display:grid;gap:10px}
.card{padding:16px;border:1px solid #242424;border-radius:14px;background:#0e0e0e}.name{font-weight:700}.value{margin-top:8px;color:#bbb;white-space:pre-wrap}.tag{display:inline-block;margin:10px 6px 0 0;color:#ff6a3d;font-size:12px}
</style></head>
<body><h1>snapmark</h1><p>Your local developer knowledge vault.</p>
<input id="q" placeholder="Search bookmarks, snippets, commands, docs...">
<div id="list" class="grid"></div>
<script>
const q=document.querySelector('#q'), list=document.querySelector('#list');
async function load(){const u=q.value?'/api/search?q='+encodeURIComponent(q.value):'/api/entries';const r=await fetch(u);const data=await r.json();list.innerHTML=data.map(e=>'<article class="card"><div class="name">'+esc(e.name)+'</div><div class="value">'+esc(e.value)+'</div><div>'+e.tags.map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div></article>').join('')||'<p>No entries found.</p>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
q.addEventListener('input',()=>load());load();
</script></body></html>
